<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>AgroX — Logs de Acesso</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <style>
        :root {
            --laranja: #FF8200;
            --cinza: #6f7072;
            --cinza-claro: #ecedec;
        }

        body {
            background: var(--cinza-claro);
            color: #333;
        }

        .topo {
            background: var(--laranja);
            color: #fff;
        }

        .btn-laranja {
            background: var(--laranja);
            border-color: var(--laranja);
            color: #fff;
        }

        .btn-laranja:hover,
        .btn-laranja:focus {
            background: #e67500;
            border-color: #e67500;
            color: #fff;
        }

        .resumo .card {
            border: 0;
            border-left: 4px solid var(--laranja);
        }

        .resumo .valor {
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1;
        }

        .resumo .rotulo {
            color: var(--cinza);
            font-size: .8rem;
            text-transform: uppercase;
            letter-spacing: .03em;
        }

        .table thead th {
            background: var(--cinza);
            color: #fff;
            border: 0;
            font-weight: 600;
            white-space: nowrap;
        }

        .table td {
            vertical-align: middle;
        }

        .mono {
            font-family: SFMono-Regular, Menlo, Consolas, monospace;
            font-size: .85rem;
        }

        .badge-localizado {
            background: #28a745;
            color: #fff;
        }

        .badge-nao-localizado {
            background: var(--cinza);
            color: #fff;
        }

        .log-card {
            border: 0;
            border-left: 4px solid var(--cinza);
        }

        .log-card.localizado {
            border-left-color: #28a745;
        }

        .log-card dt {
            color: var(--cinza);
            font-weight: 500;
            font-size: .8rem;
        }

        .log-card dd {
            margin-bottom: .4rem;
            word-break: break-word;
        }

        a.mapa {
            color: var(--laranja);
        }
    </style>
</head>

<body>
    <header class="topo py-3 mb-4 shadow-sm">
        <div class="container d-flex align-items-center justify-content-between flex-wrap">
            <h1 class="h4 mb-0">Logs de Acesso</h1>
            <a href="dashboard.html" class="text-white small">&larr; Voltar ao painel</a>
        </div>
    </header>

    <main class="container pb-5">
        <!-- Barra de ações -->
        <div class="form-row align-items-center mb-3">
            <div class="col-12 col-md mb-2 mb-md-0">
                <input type="search" id="filtro" class="form-control" placeholder="Filtrar por usuário, IP ou status…">
            </div>
            <div class="col-12 col-md-auto">
                <button type="button" id="btn-atualizar" class="btn btn-laranja btn-block">
                    <span id="spinner" class="spinner-border spinner-border-sm mr-1 d-none" role="status"></span>
                    Atualizar
                </button>
            </div>
        </div>

        <!-- Resumo -->
        <div class="row resumo mb-3">
            <div class="col-4">
                <div class="card shadow-sm p-3">
                    <div class="valor" id="qtd-total">—</div>
                    <div class="rotulo">Total</div>
                </div>
            </div>
            <div class="col-4">
                <div class="card shadow-sm p-3">
                    <div class="valor" id="qtd-localizado">—</div>
                    <div class="rotulo">Localizados</div>
                </div>
            </div>
            <div class="col-4">
                <div class="card shadow-sm p-3">
                    <div class="valor" id="qtd-nao-localizado">—</div>
                    <div class="rotulo">Não localizados</div>
                </div>
            </div>
        </div>

        <div id="alerta" class="alert d-none" role="alert"></div>

        <!-- Tabela (telas médias e maiores) -->
        <div class="card shadow-sm d-none d-md-block">
            <div class="table-responsive">
                <table class="table table-hover table-sm mb-0">
                    <thead>
                        <tr>
                            <th class="pl-3">Data/Hora</th>
                            <th>Usuário</th>
                            <th>Status</th>
                            <th>IP</th>
                            <th>Localização</th>
                            <th>Precisão</th>
                            <th class="pr-3">Recebido em</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo"></tbody>
                </table>
            </div>
        </div>

        <!-- Cartões (telas pequenas) -->
        <div id="lista-cartoes" class="d-md-none"></div>

        <p class="text-muted small text-right mt-2 mb-0" id="ultima-atualizacao"></p>
    </main>

    <script src="js/chat-config.js"></script>
    <script>
        (function () {
            'use strict';

            var config = window.AGROX_CHAT_CONFIG || {};
            var ENDPOINT = (config.apiBaseUrl || 'https://ommnascimento.pythonanywhere.com').replace(/\/+$/, '') + '/registrar';

            var registros = [];

            var el = {
                filtro: document.getElementById('filtro'),
                botao: document.getElementById('btn-atualizar'),
                spinner: document.getElementById('spinner'),
                alerta: document.getElementById('alerta'),
                tabela: document.getElementById('tabela-corpo'),
                cartoes: document.getElementById('lista-cartoes'),
                total: document.getElementById('qtd-total'),
                localizado: document.getElementById('qtd-localizado'),
                naoLocalizado: document.getElementById('qtd-nao-localizado'),
                atualizacao: document.getElementById('ultima-atualizacao')
            };

            function escapar(valor) {
                if (valor === null || valor === undefined || valor === '') return '—';
                return String(valor)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function formatarData(iso) {
                if (!iso) return '—';
                var d = new Date(iso);
                if (isNaN(d.getTime())) return escapar(iso);
                return d.toLocaleString('pt-BR', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
            }

            function temCoordenadas(r) {
                return r.latitude !== null && r.latitude !== undefined &&
                    r.longitude !== null && r.longitude !== undefined;
            }

            function htmlLocalizacao(r) {
                if (!temCoordenadas(r)) return '<span class="text-muted">—</span>';
                var lat = Number(r.latitude).toFixed(6);
                var lon = Number(r.longitude).toFixed(6);
                var url = 'https://www.google.com/maps?q=' + encodeURIComponent(lat + ',' + lon);
                return '<a class="mapa mono" href="' + url + '" target="_blank" rel="noopener">' +
                    lat + ', ' + lon + '</a>';
            }

            function htmlPrecisao(r) {
                if (r.precisao === null || r.precisao === undefined) return '—';
                return Math.round(Number(r.precisao)) + ' m';
            }

            function htmlStatus(status) {
                if (status === 'localizado') {
                    return '<span class="badge badge-localizado">Localizado</span>';
                }
                if (status === 'nao_localizado') {
                    return '<span class="badge badge-nao-localizado">Não localizado</span>';
                }
                return '<span class="badge badge-secondary">' + escapar(status) + '</span>';
            }

            function linhaTabela(r) {
                return '<tr>' +
                    '<td class="pl-3 text-nowrap">' + formatarData(r.dataHora) + '</td>' +
                    '<td>' + escapar(r.usuario) + '</td>' +
                    '<td>' + htmlStatus(r.status) + '</td>' +
                    '<td class="mono">' + escapar(r.ip) + '</td>' +
                    '<td>' + htmlLocalizacao(r) + '</td>' +
                    '<td class="text-nowrap">' + htmlPrecisao(r) + '</td>' +
                    '<td class="pr-3 text-nowrap text-muted small">' + formatarData(r.recebidoEm) + '</td>' +
                    '</tr>';
            }

            function cartao(r) {
                var classe = r.status === 'localizado' ? ' localizado' : '';
                return '<div class="card log-card shadow-sm mb-2' + classe + '"><div class="card-body p-3">' +
                    '<div class="d-flex justify-content-between align-items-start mb-2">' +
                    '<strong>' + escapar(r.usuario) + '</strong>' + htmlStatus(r.status) +
                    '</div>' +
                    '<dl class="row mb-0 small">' +
                    '<dt class="col-5">Data/Hora</dt><dd class="col-7">' + formatarData(r.dataHora) + '</dd>' +
                    '<dt class="col-5">IP</dt><dd class="col-7 mono">' + escapar(r.ip) + '</dd>' +
                    '<dt class="col-5">Localização</dt><dd class="col-7">' + htmlLocalizacao(r) + '</dd>' +
                    '<dt class="col-5">Precisão</dt><dd class="col-7">' + htmlPrecisao(r) + '</dd>' +
                    '<dt class="col-5">Recebido em</dt><dd class="col-7 text-muted">' + formatarData(r.recebidoEm) + '</dd>' +
                    '</dl></div></div>';
            }

            function mostrarAlerta(tipo, mensagem) {
                el.alerta.className = 'alert alert-' + tipo;
                el.alerta.textContent = mensagem;
            }

            function ocultarAlerta() {
                el.alerta.className = 'alert d-none';
            }

            function atualizarResumo(lista) {
                var loc = lista.filter(function (r) { return r.status === 'localizado'; }).length;
                el.total.textContent = lista.length;
                el.localizado.textContent = loc;
                el.naoLocalizado.textContent = lista.length - loc;
            }

            function renderizar() {
                var termo = el.filtro.value.trim().toLowerCase();
                var lista = registros.filter(function (r) {
                    if (!termo) return true;
                    return [r.usuario, r.ip, r.status, r.status === 'nao_localizado' ? 'não localizado' : '']
                        .join(' ').toLowerCase().indexOf(termo) !== -1;
                });

                atualizarResumo(lista);

                if (!lista.length) {
                    var vazio = registros.length ? 'Nenhum registro corresponde ao filtro.' : 'Nenhum registro encontrado.';
                    el.tabela.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">' + vazio + '</td></tr>';
                    el.cartoes.innerHTML = '<p class="text-center text-muted py-4">' + vazio + '</p>';
                    return;
                }

                el.tabela.innerHTML = lista.map(linhaTabela).join('');
                el.cartoes.innerHTML = lista.map(cartao).join('');
            }

            function carregando(ativo) {
                el.botao.disabled = ativo;
                el.spinner.classList.toggle('d-none', !ativo);
            }

            function carregar() {
                carregando(true);
                ocultarAlerta();

                fetch(ENDPOINT, { method: 'GET', headers: { 'Accept': 'application/json' } })
                    .then(function (resp) {
                        if (!resp.ok) throw new Error('HTTP ' + resp.status);
                        return resp.json();
                    })
                    .then(function (json) {
                        var dados = (json && json.data) || {};
                        registros = Array.isArray(dados.registros) ? dados.registros.slice() : [];
                        // Mais recentes primeiro
                        registros.sort(function (a, b) {
                            return new Date(b.dataHora || b.recebidoEm) - new Date(a.dataHora || a.recebidoEm);
                        });
                        renderizar();
                        el.atualizacao.textContent = 'Última atualização: ' + new Date().toLocaleString('pt-BR');
                    })
                    .catch(function (erro) {
                        console.error('Falha ao carregar logs:', erro);
                        mostrarAlerta('danger', 'Não foi possível carregar os logs (' + erro.message + '). Tente novamente.');
                    })
                    .finally(function () {
                        carregando(false);
                    });
            }

            el.botao.addEventListener('click', carregar);
            el.filtro.addEventListener('input', renderizar);

            carregar();
        })();
    </script>
</body>

</html>
